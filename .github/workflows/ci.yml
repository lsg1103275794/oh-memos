name: CI

# Fast feedback on every push/PR to main. Two independent jobs:
#   node   — build, vitest suite, and the tool-surface budget gate
#   python — the offline pytest contracts (write/relation/redact/keyword);
#            live API tests are excluded because no stack is running here
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: lets a run be kicked off without an empty commit, and is the
  # first thing to try after re-enabling Actions on the account.
  workflow_dispatch:

jobs:
  hooks:
    name: Repo consistency (hook matchers · deploy bundle · README changelog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A hook `matcher` is evaluated against the TOOL NAME only. Anything
      # containing a character outside [A-Za-z0-9_-, |*] is treated as an
      # unanchored regex, so an expression matcher silently never fires — and a
      # shipped template carrying that typo hands the dead hook to every user
      # who copies it. This gate is cheap and catches the whole class.
      - run: node scripts/lint-hook-matchers.mjs

      # oh-memos-deploy/ ships a copy of the hook set. It previously drifted from
      # project-memory/hooks/ (stale exit code, missing guard), so the copy is
      # verified rather than trusted.
      - run: node scripts/sync-deploy-hooks.mjs

      # The READMEs' "Recent changes" block is generated from docs/CHANGELOG.md.
      # This fails when a changelog entry lands without regenerating it, which is
      # the drift the hand-written list used to accumulate silently.
      - run: node scripts/generate-readme-changelog.mjs

  node:
    name: Node MCP (Node ${{ matrix.node }} · build · vitest · protocol)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: mcp-server-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp-server-node/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test
        env:
          # All vitest files are offline; the import-time config only needs
          # these to exist (no .env is present on a fresh checkout).
          MEMOS_URL: http://127.0.0.1:18000
          MEMOS_USER: ci
          MEMOS_DEFAULT_CUBE: ci_cube
          MEMOS_CUBES_DIR: /tmp/oh-memos-cubes

      # Raw JSON-RPC coverage protects the initialize-era stdio contract across
      # SDK upgrades, including conditional tools and client argument quirks.
      - run: npm run test:protocol

      # The tool surface is a per-turn token cost; this gate fails when the
      # schema drifts >5% over the frozen baseline without an explicit re-freeze.
      - run: npm run schema:budget
        env:
          MEMOS_URL: http://127.0.0.1:18000
          MEMOS_USER: ci
          MEMOS_DEFAULT_CUBE: ci_cube
          MEMOS_CUBES_DIR: /tmp/oh-memos-cubes

      # Semantic schema snapshots ignore JSON Schema dialect/ref layout while
      # freezing business constraints, descriptions, annotations, and order.
      - run: npm run schema:semantic
        env:
          MEMOS_URL: http://127.0.0.1:18000
          MEMOS_USER: ci
          MEMOS_DEFAULT_CUBE: ci_cube
          MEMOS_CUBES_DIR: /tmp/oh-memos-cubes

      # The v2 client harness is dev-only; keep it out of the published tarball.
      - run: npm run test:pack

  windows-protocol:
    name: Windows Node MCP (protocol · package boundary)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mcp-server-node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server-node/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run test:protocol
      - run: npm run schema:semantic
        env:
          MEMOS_URL: http://127.0.0.1:18000
          MEMOS_USER: ci
          MEMOS_DEFAULT_CUBE: ci_cube
          MEMOS_CUBES_DIR: ${{ runner.temp }}\oh-memos-cubes
      - run: npm run test:pack

  python:
    name: Python API (offline pytest contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Importing oh_memos no longer needs torch, and the API image ships without
      # it. CI still installs CPU torch so the KV-cache activation tests exercise a
      # real DynamicCache. The CPU-only index keeps the install roughly 6x smaller
      # than the default CUDA wheels.
      - name: Install package with CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          # Install the optional client exercised by the confirmed-vector storage
          # contracts.
          pip install -e . "pytest>=8.3.5,<9" "qdrant-client>=1.16.0,<2.0.0"

      - name: Run offline tests
        env:
          # Live tests (test_search_project, test_graph_data) need a running
          # API + Neo4j + Qdrant; they are integration smoke tests, not CI.
          # Scoping to tests/ also avoids collecting oh-memos-cli/tests and
          # the deprecated mcp-server/, which have their own dependency sets.
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          pytest -q tests/ \
            --ignore=tests/test_search_project.py \
            --ignore=tests/test_graph_data.py
